<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Klasbordstudio leerling</title><link rel="stylesheet" href="styles.css"><style>body{min-height:100vh;display:grid;place-items:center;padding:20px}.student-card{width:min(520px,100%);background:white;border-radius:22px;padding:24px;box-shadow:var(--shadow)}.student-card input,.student-card textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;margin:6px 0}.student-card textarea{min-height:130px}.student-card h1{margin:0}.privacy{font-size:12px;color:var(--muted);background:#f2f8fa;padding:9px;border-radius:9px}</style><script src="protection.js" defer></script></head><body><main class="student-card"><p class="eyebrow">KLASBORDSTUDIO</p><h1>Neem deel</h1><p>Code: <strong id="code"></strong></p><label>Je voornaam<input id="name" autocomplete="off" placeholder="Voornaam"></label><div id="join"><button class="primary" id="joinBtn">Aanmelden</button></div><section id="activity" hidden><h2 id="question">Wachten op de leerkracht…</h2><textarea id="answer" placeholder="Typ je antwoord"></textarea><button class="primary" id="sendBtn">Antwoord versturen</button><p id="status"></p></section><p class="privacy">Je naam verschijnt niet op het klasbord. Alleen de leerkracht ziet in het dashboard welke naam bij welk antwoord hoort.</p><div class="student-copyright">© 2026 Studio SaGo · Klasbordstudio</div></main><script>const code=new URLSearchParams(location.search).get("code")||"";document.querySelector("#code").textContent=code;let token=null;async function poll(){if(!code)return;let r=await fetch("/api/room/"+code+"/student"+(token?"?token="+encodeURIComponent(token):""));if(!r.ok)return;let d=await r.json();document.querySelector("#question").textContent=d.question||"Wachten op de leerkracht…"}document.querySelector("#joinBtn").onclick=async()=>{let name=document.querySelector("#name").value.trim();if(!name)return;let r=await fetch("/api/room/"+code+"/join",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name})});let d=await r.json();if(d.token){token=d.token;document.querySelector("#join").hidden=true;document.querySelector("#name").disabled=true;document.querySelector("#activity").hidden=false;poll();setInterval(poll,1500)}};document.querySelector("#sendBtn").onclick=async()=>{let answer=document.querySelector("#answer").value.trim();if(!token||!answer)return;await fetch("/api/room/"+code+"/answer",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,answer})});document.querySelector("#status").textContent="Antwoord ontvangen ✓";document.querySelector("#answer").value=""}</script><footer class="kbs-site-copyright" aria-label="Copyright">© 2026 Studio SaGo · Klasbordstudio</footer>
</body></html>
